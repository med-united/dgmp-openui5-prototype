# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS Configuration (for OpenUI5 development)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Logging Configuration
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."de.servicehealth".level=DEBUG
quarkus.log.category."ca.uhn.fhir".level=WARN

# Application Configuration
quarkus.application.name=ePA Medication Service UI
quarkus.banner.enabled=true

# Static Resources (serve OpenUI5 app)
quarkus.http.static-resources.cached-in-dev=false

# Dev Services (disable for now)
quarkus.devservices.enabled=false

# Native Build (if needed)
quarkus.native.resources.includes=**/*.json,**/*.xml,**/*.properties
