<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePA Medication Service</title>

    <script id="sap-ui-bootstrap" src="https://openui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-libs="sap.m,sap.ui.layout,sap.ui.table" data-sap-ui-async="true"
        data-sap-ui-bindingSyntax="complex" data-sap-ui-compatVersion="edge" data-sap-ui-resourceroots='{"epa": "./"}'>
        </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/ui/core/mvc/XMLView",
                "epa/controller/PatientSelection.controller"
            ], function (XMLView) {
                XMLView.create({
                    viewName: "epa.view.PatientSelection"
                }).then(function (oView) {
                    oView.placeAt("content");
                });
            });
        });
    </script>
    <style>
        /* Reconciliation Split View Styling */
        .reconciliationSplitView {
            height: 70vh;
        }

        .reconciliationPanel {
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Color-coded borders for match types */
        .formatRowHighlight .sapUiTableTr>td:first-child {
            border-left: 4px solid transparent;
        }

        /* List item spacing */
        .sapMCustomListItem {
            border-bottom: 1px solid #f7f7f7;
        }
    </style>
</head>

<body class="sapUiBody" id="content">
</body>

</html>
