<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePA Medication Service</title>

    <!--
        sap.fhir namespace mapped to openui5-fhir@2.4.0 on unpkg CDN (src/ contains the sap/ subtree).
    -->
    <script id="sap-ui-bootstrap"
        src="https://sdk.openui5.org/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.layout,sap.ui.table,sap.fhir"
        data-sap-ui-async="true"
        data-sap-ui-bindingSyntax="complex"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-resourceroots='{
            "epa": "./",
            "sap.fhir": "https://unpkg.com/openui5-fhir@2.4.0/src/sap/fhir"
        }'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/ui/core/ComponentContainer"
            ], function (ComponentContainer) {
                var oContainer = new ComponentContainer({
                    name: "epa",
                    settings: {
                        id: "epa"
                    },
                    async: true
                });
                oContainer.placeAt("content");
            });
        });
    </script>
    <style>
        /* Reconciliation Split View Styling */
        .reconciliationSplitView {
            height: 70vh;
        }

        .reconciliationPanel {
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Color-coded borders for match types */
        .formatRowHighlight .sapUiTableTr>td:first-child {
            border-left: 4px solid transparent;
        }

        /* List item spacing */
        .sapMCustomListItem {
            border-bottom: 1px solid #f7f7f7;
        }
    </style>
</head>

<body class="sapUiBody" id="content">
</body>

</html>
